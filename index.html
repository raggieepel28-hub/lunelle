<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8a8b8">
<title>Lunelle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<header>
  <div class="brand">☾ <span>Lunelle</span></div>
  <div class="tagline">your little days</div>
</header>

<nav id="tabs"></nav>

<main>

 <section class="card schedule-card">
  <h2>♡ Daily Schedule</h2>

  <div id="schedule"></div>

  <form id="scheduleForm" class="addform">

    <input id="scheduleTime" type="time" required>

    <input
      id="scheduleText"
      placeholder="この時間にすること"
      required
    >

    <select id="scheduleEmoji">
      <option value="♡">♡</option>
      <option value="🎀">🎀</option>
      <option value="💗">💗</option>
      <option value="🌷">🌷</option>
      <option value="☕">☕</option>
      <option value="🍰">🍰</option>
      <option value="🎮">🎮</option>
      <option value="🛍️">🛍️</option>
      <option value="🛁">🛁</option>
      <option value="💻">💻</option>
      <option value="📚">📚</option>
      <option value="⭐">⭐</option>
    </select>

    <button type="submit">＋</button>

  </form>
</section> 
<section class="card calendar-card">

  <div class="month-row">
    <button id="prev">‹</button>
    <h1 id="month"></h1>
    <button id="next">›</button>
  </div>

  <div class="week">
    <span>Sun</span>
    <span>Mon</span>
    <span>Tue</span>
    <span>Wed</span>
    <span>Thu</span>
    <span>Fri</span>
    <span>Sat</span>
  </div>

  <div id="days" class="days"></div>

</section>


<section class="card">

  <h2>♡ Today's Plan</h2>

  <div id="plan"></div>

  <form id="planForm" class="addform">

    <input
      id="planTime"
      type="time"
      required
    >

    <input
      id="planText"
      placeholder="この時間にしたいこと"
      required
    >

    <select id="planEmoji">
      <option value="♡">♡</option>
      <option value="🎀">🎀</option>
      <option value="💗">💗</option>
      <option value="🛍️">🛍️</option>
      <option value="🍰">🍰</option>
      <option value="📝">📝</option>
      <option value="⭐">⭐</option>
      <option value="🌷">🌷</option>
      <option value="☕">☕</option>
      <option value="🎮">🎮</option>
    </select>

    <button type="submit">＋</button>

  </form>

</section>


<section class="card">

  <h2>☑ To Do</h2>

  <div id="todos"></div>

  <form id="todoForm" class="addform">

    <input
      id="todoText"
      placeholder="新しいTodo…"
      required
    >

    <button type="submit">＋</button>

  </form>

</section>

<section class="card mood-card">

  <h2>♡ Today's Mood</h2>

  <div id="moodChoices" class="mood-choices">

  <button type="button" data-mood="♡">
    <span>♡</span>
    <small>Happy</small>
  </button>

  <button type="button" data-mood="୨୧">
    <span>୨୧</span>
    <small>Sweet</small>
  </button>

  <button type="button" data-mood="✧">
    <span>✧</span>
    <small>Fine</small>
  </button>

  <button type="button" data-mood="☾">
    <span>☾</span>
    <small>Sleepy</small>
  </button>

  <button type="button" data-mood="☁">
    <span>☁</span>
    <small>Blue</small>
  </button>

  <button type="button" data-mood="𓂃">
    <span>𓂃</span>
    <small>Tired</small>
  </button>

</div>

  <div id="selectedMood" class="selected-mood"></div>

</section>


<section class="card diary-card">

  <h2>📝 Today's Diary</h2>

  <textarea
    id="diary"
    placeholder="今日はどんな1日だった？&#10;&#10;嬉しかったこと、頑張ったこと、推しのこと…&#10;自由に書いてね ♡"
  ></textarea>

</section>
<section class="card">

  <h2>📝 Memo</h2>

  <textarea
    id="memo"
    placeholder="今日のことを自由に書いてね…"
  ></textarea>

</section>

</main>

<footer>
  🌙 made for little days 🌙
</footer>

<script src="app.js"></script>

</body>
</html>
