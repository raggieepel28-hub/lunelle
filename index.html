<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8a8b8">
<title>Lunelle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="brand">☾ <span>Lunelle</span></div>
  <div class="tagline">your little days</div>
</header>

<nav id="tabs"></nav>

<main>

<section class="card calendar-card">

  <div class="month-row">
    <button id="prev">‹</button>
    <h1 id="month"></h1>
    <button id="next">›</button>
  </div>

  <div class="week">
    <span>Sun</span>
    <span>Mon</span>
    <span>Tue</span>
    <span>Wed</span>
    <span>Thu</span>
    <span>Fri</span>
    <span>Sat</span>
  </div>

  <div id="days" class="days"></div>

</section>


<section class="card">

  <h2>♡ Today's Plan</h2>

  <div id="plan"></div>

  <form id="planForm" class="addform">

    <input
      id="planTime"
      type="time"
      required
    >

    <input
      id="planText"
      placeholder="この時間にしたいこと"
      required
    >

    <select id="planEmoji">
      <option value="♡">♡</option>
      <option value="🎀">🎀</option>
      <option value="💗">💗</option>
      <option value="🛍️">🛍️</option>
      <option value="🍰">🍰</option>
      <option value="📝">📝</option>
      <option value="⭐">⭐</option>
      <option value="🌷">🌷</option>
      <option value="☕">☕</option>
      <option value="🎮">🎮</option>
    </select>

    <button type="submit">＋</button>

  </form>

</section>


<section class="card">

  <h2>☑ To Do</h2>

  <div id="todos"></div>

  <form id="todoForm" class="addform">

    <input
      id="todoText"
      placeholder="新しいTodo…"
      required
    >

    <button type="submit">＋</button>

  </form>

</section>


<section class="card">

  <h2>📝 Memo</h2>

  <textarea
    id="memo"
    placeholder="今日のことを自由に書いてね…"
  ></textarea>

</section>

</main>

<footer>
  🌙 made for little days 🌙
</footer>

<script src="app.js"></script>

</body>
</html>
